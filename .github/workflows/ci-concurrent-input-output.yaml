name: concurrent input/outputs

on:
    push:
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            environment:
                description: 'Which environment?'
                required: true
                default: 'develop'
                type: choice
                options:
                    - develop
                    - preprod
                    - prod
            run_tests:
                description: 'want to run tests?'
                required: false
                default: true
                type: boolean


concurrency: #stops running parallel workflows and new-job wait to finish-old
  group: main-deploy
  cancel-in-progress: false

jobs:
    build-job: 
        runs-on: ubuntu-slim
        outputs:
            tag: ${{ steps.tag-id.outputs.tag}} #passes output of one job to another
        steps:
            - id: tag-id
              run: echo "tag=v1.2" >> "$GITHUB_OUTPUT"
            
            - run: echo "Building myapp:${{ steps.tag-id.outputs.tag }}"
            - run: sleep 60
    deploy-job:
        needs: build-job
        runs-on: ubuntu-slim
        steps:
            - run: echo "Deploying myapp:${{ needs.build-job.outputs.tag }}" 