name: Build node app
on: 
    push:
        branches:
            - main

jobs:
    nodeapp-job:
        runs-on: "ubuntu-slim"
        # defaults:
        #     run:
        #         working-directory: ./nodejs #working dir should be in composite
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: build app
              uses: ./.github/actions/build

            - name: deploy
              uses: ./.github/actions/deploy
