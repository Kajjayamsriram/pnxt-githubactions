name: Build Application
description: install deps and build app

runs:
   using: composite
   steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: install deps
        run: npm ci --omit=dev
        shell: bash

      - name: build app
        run: npm run build
        shell: bash