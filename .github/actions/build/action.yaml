name: Build Application
description: install deps and build app

runs:
   using: composite
   steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
    
      - name: cache dependencies
        id: react-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm            
          key: ${{ runner.os }}-npm-${{ hashFiles('nodejs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: install deps
        run: npm ci --omit=dev
        working-directory: ./nodejs
        shell: bash

      - name: node lint
        working-directory: ./nodejs
        run: npm run lint
        shell: bash
        
      - name: run test cases
        working-directory: ./nodejs
        run: npm run test -- --watchAll=false --passWithNoTests
        shell: bash

      - name: build app
        run: npm run build
        working-directory: ./nodejs
        shell: bash